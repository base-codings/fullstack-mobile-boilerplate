name: mobile_boilerplate
description: Mobile boilerplate Flutter app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  api_client:
    path: ../../packages/api_client
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.4
  go_router: ^14.6.0
  intl: any
  json_annotation: ^4.9.0
  meta: ^1.16.0
  # riverpod_annotation removed — scaffold uses plain Provider/AsyncNotifierProvider.
  # Re-add when migrating to @riverpod codegen (also re-add riverpod_generator
  # in dev_dependencies). See lib/core/di/providers.dart for migration notes.

dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0
  # riverpod_generator + custom_lint + riverpod_lint removed:
  # all three transitively pull analyzer_plugin 0.12.0, which uses the
  # legacy Element API and fails to precompile against analyzer 7.x
  # (Dart 3.6+) — breaks `dart run build_runner build` on Linux CI.
  # The scaffold doesn't use @riverpod codegen yet (controllers use plain
  # AsyncNotifierProvider), so these are dead weight today.
  # Re-add all three when each publishes a release compatible with analyzer 7.x.

flutter:
  generate: true # for gen_l10n in Phase 05
  uses-material-design: true
  assets:
    - .env # ★ single .env file (gitignored). Adopter copies from .env.example.
    # <!-- Red Team #11, #15 -->: Only non-secret runtime config here.
    # Secrets MUST come from flutter_secure_storage (Keychain/Keystore).
