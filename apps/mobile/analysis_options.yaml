include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    avoid_relative_lib_imports: error
  plugins:
    - custom_lint
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - 'lib/l10n/generated/**'
    # Flutter `flutter gen-l10n` outputs to lib/l10n/ (not lib/l10n/generated/)
    # by default. Exclude generated AppLocalizations sources from lint.
    - 'lib/l10n/app_localizations*.dart'

linter:
  rules:
    always_use_package_imports: true
    avoid_relative_lib_imports: true
