include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    avoid_relative_lib_imports: error
  # custom_lint plugin disabled — packages also removed from pubspec.yaml.
  # Reason: analyzer_plugin 0.12.0 (transitive dep) uses the legacy Element
  # API which analyzer 7.x (Dart 3.6+) replaced with Element2. AOT compile
  # fails for both `dart analyze` (plugin load) and `dart run build_runner
  # build` (entrypoint precompile). Re-enable + re-add deps when both
  # custom_lint and riverpod_lint publish releases compatible with analyzer 7.x.
  # plugins:
  #   - custom_lint
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - 'lib/l10n/generated/**'
    # Flutter `flutter gen-l10n` outputs to lib/l10n/ (not lib/l10n/generated/)
    # by default. Exclude generated AppLocalizations sources from lint.
    - 'lib/l10n/app_localizations*.dart'

linter:
  rules:
    always_use_package_imports: true
    avoid_relative_lib_imports: true
    # --- Relaxed for boilerplate scaffold (see docs/code-standards.md) ---
    # Boilerplate code is intentionally minimal; field names are self-
    # documenting. Adopters add docs to their own business APIs as needed.
    public_member_api_docs: false
    # 80 chars too tight for modern Flutter method chains. Project uses 100
    # (configure `dart format --line-length=100` for matching auto-format).
    lines_longer_than_80_chars: false
    # Clean Architecture pattern: HelloRepository is intentionally an abstract
    # class (single method today, easily extended). Don't suggest replacing
    # with a typedef/Function type.
    one_member_abstracts: false
