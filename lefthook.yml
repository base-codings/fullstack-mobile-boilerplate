# Lefthook config — git hooks runner.
# Pre-commit: lint + format staged files (parallel).
# Pre-push: run tests for affected workspace.
#
# Notes:
#   - dart/fvm/flutter guarded so backend-only contributors and CI bots
#     without Flutter toolchain don't get blocked (Red Team #13).
#   - Mobile env file scan blocks committing secrets to apps/mobile/.env*
#     (Red Team #11).

pre-commit:
  parallel: true
  commands:
    lint-api:
      glob: "apps/api/**/*.{ts,js}"
      run: pnpm --filter @mobile-boilerplate/api exec eslint --fix --max-warnings=0 {staged_files}
      stage_fixed: true

    format-api:
      glob: "apps/api/**/*.{ts,js,json,md}"
      run: pnpm --filter @mobile-boilerplate/api exec prettier --write {staged_files}
      stage_fixed: true

    analyze-mobile:
      glob: "apps/mobile/**/*.dart"
      run: |
        cd apps/mobile
        if command -v fvm >/dev/null; then
          fvm dart analyze --fatal-infos {staged_files}
        elif command -v dart >/dev/null; then
          dart analyze --fatal-infos {staged_files}
        else
          echo "::warning::dart/fvm not installed — skipping (CI will catch)"
        fi

    format-mobile:
      glob: "apps/mobile/**/*.dart"
      run: |
        cd apps/mobile
        if command -v fvm >/dev/null; then
          fvm dart format {staged_files}
        elif command -v dart >/dev/null; then
          dart format {staged_files}
        else
          echo "::warning::dart/fvm not installed — skipping format"
        fi
      stage_fixed: true

    lint-mobile-env:
      glob: "apps/mobile/.env*"
      run: bash tools/scripts/lint-mobile-env.sh {staged_files}

pre-push:
  commands:
    test-api:
      run: pnpm --filter @mobile-boilerplate/api test --passWithNoTests

    test-mobile:
      run: |
        cd apps/mobile
        if command -v fvm >/dev/null; then
          fvm flutter test
        elif command -v flutter >/dev/null; then
          flutter test
        else
          echo "::warning::flutter not installed — skipping (CI will catch)"
        fi
