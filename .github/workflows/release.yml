name: Release

# Gated by CI success — workflow_run avoids racing api-ci/mobile-ci.
on:
  workflow_run:
    workflows: [API CI, Mobile CI]
    branches: [main, beta]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Determine semantic-release config
        id: cfg
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "beta" ]; then
            echo "config=.releaserc.beta-config.json" >> "$GITHUB_OUTPUT"
          else
            echo "config=.releaserc.production.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Run semantic-release
        run: pnpm exec semantic-release --extends "$(pwd)/${{ steps.cfg.outputs.config }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
