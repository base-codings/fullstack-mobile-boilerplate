# Local development compose file.
# Only the API service runs here — Postgres is managed by Supabase.
#
# Usage:
#   cp apps/api/.env.example apps/api/.env   # fill in DATABASE_URL/DIRECT_URL or set SKIP_DB=true
#   docker compose up api

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: mobile-boilerplate-api:local
    env_file:
      - apps/api/.env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
